<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>pipeflame</title>
        <style>
            html, body { height: 100%; margin: 0; font: 13px -apple-system, system-ui, sans-serif; }
            body { display: flex; flex-direction: column; }
            #controls { display: flex; gap: 12px; align-items: center; padding: 6px 12px; border-bottom: 1px solid #ccc; }
            #controls label { display: flex; gap: 6px; align-items: center; }
            #viewer { flex: 1; position: relative; isolation: isolate; }
            #viewer iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 1; }
            /* a reload renders behind the current view and is swapped in once it's drawn */
            #viewer iframe.loading { z-index: 0; pointer-events: none; }
            #empty { padding: 24px; color: #666; }
            #copy.icon { display: inline-flex; align-items: center; padding: 3px 6px; }
        </style>
    </head>
    <body>
        <!-- add new controls here; anything they change should go through setFilter() -->
        <div id="controls">
            <strong>pipeflame</strong>
            <label>Tenant
                <select id="tenant">
                    <option value="">All</option>
                </select>
            </label>
            <button id="refresh">Refresh</button>
            <label>Auto-refresh
                <select id="autorefresh">
                    <option value="0">None</option>
                    <option value="15">15 seconds</option>
                    <option value="30">30 seconds</option>
                    <option value="60">1 minute</option>
                </select>
            </label>
            <button id="clear">Clear</button>
            <button id="copy" class="icon" title="Copy the message of the selected frame" aria-label="Copy the message of the selected frame"></button>
            <a href="/logout" style="margin-left: auto">Log out</a>
        </div>
        <div id="viewer"></div>

        <script>
            // query params sent to /profile.json; controls update these via setFilter()
            const filters = {};

            function setFilter(name, value) {
                if (value === "" || value == null) delete filters[name];
                else filters[name] = value;
                loadProfile();
            }

            async function loadTenants() {
                const select = document.getElementById("tenant");
                const res = await fetch("/tenants.json");
                if (res.status === 401) location.href = "/login";
                const tenants = await res.json();
                select.length = 1;
                for (const id of tenants) select.add(new Option(id, id, false, String(id) === filters.tenant_id));
                return tenants;
            }

            async function loadVersion() {
                const res = await fetch("/version.json");
                if (res.status === 401) location.href = "/login";
                return (await res.json()).version;
            }

            // recorder version the current view was built from; auto-refresh skips reloads while it matches
            let shownVersion = null;
            // iframe still loading behind the current view, if any
            let pending = null;

            async function clear(){
                let conf = window.confirm("Clear the live profiler? This will erase the current data for all users.")
                if (conf){
                    const res = await fetch("/clear.json", { method: "POST" });
                    if (res.status === 401) location.href = "/login";
                    loadProfile();
                }
            }

            // speedscope renders the selected frame's message in an element with this generated class;
            // the last one on the page is the current selection
            const MESSAGE_CLASS = "_1gb1rbb";
            const COPY_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M3 11V3.5A1.5 1.5 0 0 1 4.5 2H11"/></svg>';
            const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5l3 3 7-7"/></svg>';

            async function copyMessage() {
                const button = document.getElementById("copy");
                const iframe = document.querySelector("#viewer iframe:not(.loading)");
                const els = iframe?.contentDocument?.querySelectorAll("." + MESSAGE_CLASS) ?? [];
                const text = els.length ? els[els.length - 1].innerText : "";
                let copied = false;
                if (text) {
                    try {
                        await navigator.clipboard.writeText(text);
                        copied = true;
                    } catch {
                        // clipboard API needs a secure context; fall back to execCommand
                        const area = document.createElement("textarea");
                        area.value = text;
                        document.body.append(area);
                        area.select();
                        copied = document.execCommand("copy");
                        area.remove();
                    }
                }
                // icon flips to a check (or the title explains a failure) briefly, then resets
                button.innerHTML = copied ? CHECK_ICON : COPY_ICON;
                button.title = !text ? "Nothing selected" : copied ? "Copied" : "Copy failed";
                setTimeout(() => {
                    button.innerHTML = COPY_ICON;
                    button.title = "Copy the message of the selected frame";
                }, 1500);
            }

            async function loadProfile() {
                const viewer = document.getElementById("viewer");
                // read before the profile, so calls arriving mid-load trigger the next refresh
                const version = await loadVersion();
                const tenants = await loadTenants();
                shownVersion = version;
                pending?.remove();
                pending = null;
                if (!tenants.length) {
                    viewer.innerHTML = '<div id="empty">No calls recorded yet.</div>';
                    return;
                }
                // speedscope only reads #profileURL on load, so each reload needs a fresh iframe
                const profileURL = "/profile.json?" + new URLSearchParams(filters);
                const iframe = document.createElement("iframe");
                iframe.className = "loading";
                iframe.src = "/static/speedscope/index.html#profileURL=" + encodeURIComponent(profileURL) + "&title=pipeflame";
                pending = iframe;
                viewer.append(iframe);
                await whenRendered(iframe, profileURL);
                if (pending !== iframe) return;  // a newer load replaced this one
                pending = null;
                iframe.classList.remove("loading");
                for (const el of [...viewer.children]) if (el !== iframe) el.remove();
            }

            // resolves once speedscope in iframe has fetched profileURL and had a moment to draw it;
            // gives up waiting after 15s so a slow load still gets shown
            function whenRendered(iframe, profileURL) {
                const url = new URL(profileURL, location.href).href;
                const deadline = Date.now() + 15000;
                return new Promise(resolve => {
                    const check = () => {
                        let fetched = false;
                        try { fetched = iframe.contentWindow.performance.getEntriesByName(url).length > 0; } catch {}
                        if (fetched || Date.now() > deadline) setTimeout(resolve, 300);
                        else setTimeout(check, 100);
                    };
                    iframe.addEventListener("load", check, { once: true });
                });
            }

            async function autoRefresh() {
                if (document.hidden || pending) return;
                if (await loadVersion() !== shownVersion) loadProfile();
            }

            document.getElementById("tenant").addEventListener("change", e => setFilter("tenant_id", e.target.value));
            document.getElementById("refresh").addEventListener("click", loadProfile);
            document.getElementById("clear").addEventListener("click", clear);
            document.getElementById("copy").innerHTML = COPY_ICON;
            document.getElementById("copy").addEventListener("click", copyMessage);
            loadProfile();

            // seconds between reloads, chosen per browser and remembered; 0 means no refresh
            const autorefresh = document.getElementById("autorefresh");
            let refreshTimer = null;

            function setAutorefresh(seconds) {
                clearInterval(refreshTimer);
                refreshTimer = seconds > 0
                    ? setInterval(autoRefresh, seconds * 1000)
                    : null;
                try { localStorage.setItem("pipeflame.autorefresh", seconds); } catch {}
            }

            try {
                const saved = localStorage.getItem("pipeflame.autorefresh");
                if ([...autorefresh.options].some(o => o.value === saved)) autorefresh.value = saved;
            } catch {}
            autorefresh.addEventListener("change", e => setAutorefresh(Number(e.target.value)));
            setAutorefresh(Number(autorefresh.value));
        </script>
    </body>
</html>
